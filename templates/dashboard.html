<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>FakeBank.com - Dashboard</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    </head>
    <body>
        <div class="card">
            <!-- INTENTIONALLY VULNERABLE: | safe disables Jinja's auto-escaping,
                 so a username containing HTML/JS renders as-is (stored XSS). -->
            <h1>Welcome, {{ user['username'] | safe }}!</h1>
            <p class="balance">Balance: ${{ '%.2f' | format(user['balance']) }}</p>
            <button type="button" onclick="window.location.href = '/transfer'">Transfer</button>
            {% if transfer %}
            <p style="color: green;">Transfer successful!</p>
            {% endif %}

            {% if chart %}
            <div class="spending-chart">
                <p class="chart-title">Recent spending</p>
                <div class="chart-bars">
                    {% for point in chart %}
                    <div class="chart-bar-wrap">
                        <div class="chart-bar" data-pct="{{ point.pct }}" title="${{ '%.2f' | format(point.amount) }} on {{ point.date }}"></div>
                        <span class="chart-label">{{ point.date[5:] }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}

            <p class="subtext"><a href="/logout">Logout</a></p>
        </div>

        <script src="{{ url_for('static', filename='main.js') }}" async defer></script>
    </body>
</html>
