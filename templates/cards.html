<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>FakeBank.com - All Cards</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    </head>
    <body>
        <div class="card scoreboard-card">
            <h1>All Hashed Card Numbers</h1>
            <p class="subtext">Visible to TheMainAdmin only.</p>

            <table class="scoreboard-table">
                <thead>
                    <tr>
                        <th>Owner</th>
                        <th>Card hash (MD5)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in cards %}
                    <tr>
                        <td>{{ c['owner'] }}</td>
                        <td>{{ c['card_hash'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <p class="subtext"><a href="/dashboard">Back to Dashboard</a></p>
        </div>

        <script src="{{ url_for('static', filename='main.js') }}" async defer></script>
    </body>
</html>
